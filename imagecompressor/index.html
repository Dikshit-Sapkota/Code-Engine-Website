<!DOCTYPE html>
<html>
<head>
<title>Bulk Image to WebP Converter</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
}

h1{
    text-align:center;
}

.upload-box{
    border:2px dashed #888;
    padding:40px;
    text-align:center;
    border-radius:10px;
    cursor:pointer;
}

input{
    margin:20px 0;
}


button{
    background:#0066ff;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}


button:hover{
    background:#004ccc;
}


.image-list{
    margin-top:30px;
}


.card{
    display:flex;
    gap:20px;
    align-items:center;
    background:#fafafa;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
}


.card img{
    width:120px;
    height:90px;
    object-fit:cover;
}


.info{
    flex:1;
}


.download{
    background:green;
}


</style>

</head>


<body>


<div class="container">

<h1>
Bulk Image WebP Converter
</h1>


<div class="upload-box">

<input 
type="file" 
id="images"
multiple
accept="image/*">

<br>

<label>
Compression Quality:
</label>

<input 
type="range" 
id="quality"
min="10"
max="100"
value="80">

<span id="qualityValue">
80
</span>%


<br><br>

<button onclick="convertImages()">
Convert Images
</button>


</div>


<div id="results" class="image-list"></div>


</div>



<script>


let files=[];


document
.getElementById("images")
.addEventListener(
"change",
function(e){

files=[...e.target.files];

});



document
.getElementById("quality")
.addEventListener(
"input",
function(){

document
.getElementById("qualityValue")
.innerHTML=this.value;

});





function convertImages(){


let results=document.getElementById("results");

results.innerHTML="";


files.forEach(file=>{


let reader=new FileReader();


reader.onload=function(e){


let img=new Image();


img.onload=function(){



let canvas=document.createElement("canvas");


let ctx=canvas.getContext("2d");



let maxWidth=1600;


// resize large images

let scale=Math.min(
1,
maxWidth/img.width
);


canvas.width=img.width*scale;

canvas.height=img.height*scale;



ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);



let quality=
document.getElementById("quality").value/100;



canvas.toBlob(
function(blob){



let url=
URL.createObjectURL(blob);



let size=
(blob.size/1024).toFixed(2);



results.innerHTML+=`

<div class="card">


<img src="${url}">


<div class="info">

<strong>
${file.name}
</strong>

<br>

Original:
${(file.size/1024).toFixed(2)} KB

<br>

WebP:
${size} KB

</div>


<a href="${url}" download="${file.name.split('.')[0]}.webp">

<button class="download">
Download
</button>

</a>


</div>


`;



},
"image/webp",
quality
);



};


img.src=e.target.result;


};


reader.readAsDataURL(file);



});


}



</script>


</body>
</html>
