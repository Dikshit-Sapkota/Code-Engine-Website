name: Deploy Code Engine

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "VPS_HOST is EMPTY"; else echo "VPS_HOST exists"; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then echo "VPS_USER is EMPTY"; else echo "VPS_USER exists"; fi
          if [ -z "${{ secrets.VPS_PORT }}" ]; then echo "VPS_PORT is EMPTY"; else echo "VPS_PORT exists"; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "VPS_SSH_KEY is EMPTY"; else echo "VPS_SSH_KEY exists"; fi

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /home/codeengine.com.np/public_html
            git fetch origin
            git reset --hard origin/main
            npm ci
            npm run build
            pm2 restart codeengine
            echo "Deployment completed successfully."